# vLLM servindo o Nemotron 3 Nano 4B no projeto quantum-finetune, para a geração da linha de base e
# da reavaliação. Mesma imagem de vLLM que o cluster usa para o Gemma (vLLM 0.24, Red Hat AI), 1 GPU L4.
#
# Por que vLLM e não o generate do transformers: o código do modelo no Hugging Face tem o cache de
# geração quebrado (o cache não chega ao forward e a classe de cache tem defeitos), então cada token
# recalcula a sequência inteira (~60 s por tarefa). O vLLM tem implementação própria do Nemotron-H
# e suporta LoRA nele (conferido: supports_lora(NemotronHForCausalLM) = True).
#
# Aplicar:   oc apply -f k8s/vllm-nemotron.yaml
# Remover:   oc delete -f k8s/vllm-nemotron.yaml      (o PVC sai junto; o modelo é baixado de novo)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-cache
  namespace: quantum-finetune
  labels: {app: vllm-nemotron}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 30Gi}}      # modelo (7,9 GB) + adaptadores LoRA
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-nemotron
  namespace: quantum-finetune
  labels: {app: vllm-nemotron}
spec:
  replicas: 1
  strategy: {type: Recreate}                    # PVC RWO e 1 GPU: nunca dois pods ao mesmo tempo
  selector: {matchLabels: {app: vllm-nemotron}}
  template:
    metadata:
      labels: {app: vllm-nemotron}
    spec:
      containers:
      - name: vllm
        image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808
        command: ["vllm", "serve"]
        args:
        - nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16
        - --served-model-name=nemotron
        - --trust-remote-code
        - --dtype=bfloat16
        - --max-model-len=8192                  # maior prompt de Kata + 1024 tokens de resposta
        - --gpu-memory-utilization=0.90
        - --seed=20261104
        - --enable-lora                         # para servir o adaptador depois do treino
        - --max-lora-rank=32
        - --port=8000
        env:
        - {name: HF_HOME, value: /cache/hf}
        # A imagem vem com HF_HUB_OFFLINE=1 (espera o modelo pronto do KServe). Aqui o modelo vem do
        # Hugging Face, então o download precisa estar liberado.
        - {name: HF_HUB_OFFLINE, value: "0"}
        - {name: TRANSFORMERS_OFFLINE, value: "0"}
        - {name: HF_HUB_CACHE, value: /cache/hf/hub}
        - {name: VLLM_ALLOW_RUNTIME_LORA_UPDATING, value: "True"}   # carregar o adaptador sem reiniciar
        ports: [{containerPort: 8000, name: http}]
        resources:
          requests: {cpu: "4", memory: 24Gi, nvidia.com/gpu: "1"}
          limits: {cpu: "8", memory: 32Gi, nvidia.com/gpu: "1"}
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:                           # download de 7,9 GB + carga na GPU
          httpGet: {path: /health, port: 8000}
          periodSeconds: 15
          failureThreshold: 80
        volumeMounts:
        - {name: cache, mountPath: /cache}
        - {name: shm, mountPath: /dev/shm}
      volumes:
      - name: cache
        persistentVolumeClaim: {claimName: vllm-cache}
      - name: shm
        emptyDir: {medium: Memory, sizeLimit: 2Gi}
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-nemotron
  namespace: quantum-finetune
  labels: {app: vllm-nemotron}
spec:
  selector: {app: vllm-nemotron}
  ports: [{name: http, port: 8000, targetPort: 8000}]
